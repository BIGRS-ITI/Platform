serviceAccount:
  create: true
  name: argocd-image-updater
  annotations: {}

config:
  argocd:
    grpcWeb: true
    serverAddress: "http://argocd-server.argocd.svc.cluster.local"
    insecure: true
    plaintext: true
  
  registries:
    - name: ecr
      api_url: https://608713827966.dkr.ecr.us-east-1.amazonaws.com
      prefix: 608713827966.dkr.ecr.us-east-1.amazonaws.com
      credentials: pullsecret:argocd/ecr-credentials
      default: true

logLevel: info
interval: 2m

metrics:
  enabled: true
  serviceMonitor:
    enabled: false

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

image:
  repository: quay.io/argoprojlabs/argocd-image-updater
  pullPolicy: IfNotPresent
  tag: "v0.14.0"

extraArgs:
  - --health-port=8080
  - --metrics-port=8081

extraEnv:
  - name: AWS_REGION
    value: us-east-1
  - name: AWS_DEFAULT_REGION
    value: us-east-1

extraContainers:
  - name: ecr-token-refresher
    image: amazon/aws-cli:2.13.25
    command:
      - sh
      - -c
      - |
        echo "=== ECR Token Refresher Sidecar Started ==="
        
        # Function to refresh token
        refresh_token() {
          echo "[$(date '+%Y-%m-%d %H:%M:%S')] Fetching ECR authorization token..."
          
          # Get ECR token using Pod Identity
          TOKEN=$(aws ecr get-authorization-token \
            --region us-east-1 \
            --output text \
            --query 'authorizationData[0].authorizationToken' 2>&1)
          
          if [ $? -ne 0 ] || [ -z "$TOKEN" ]; then
            echo "ERROR: Failed to get ECR token"
            echo "Details: $TOKEN"
            return 1
          fi
          
          # Decode token to extract password
          PASSWORD=$(echo "$TOKEN" | base64 -d | cut -d: -f2)
          
          if [ -z "$PASSWORD" ]; then
            echo "ERROR: Failed to decode ECR token"
            return 1
          fi
          
          # Create/update Kubernetes secret
          kubectl create secret docker-registry ecr-credentials \
            --docker-server=608713827966.dkr.ecr.us-east-1.amazonaws.com \
            --docker-username=AWS \
            --docker-password="$PASSWORD" \
            --namespace=argocd \
            --dry-run=client -o yaml | kubectl apply -f -
          
          if [ $? -eq 0 ]; then
            echo "SUCCESS: ECR credentials secret updated"
            return 0
          else
            echo "ERROR: Failed to update Kubernetes secret"
            return 1
          fi
        }
        
        # Initial token fetch (with retries)
        echo "Performing initial ECR token fetch..."
        RETRY=0
        MAX_RETRIES=5
        
        while [ $RETRY -lt $MAX_RETRIES ]; do
          if refresh_token; then
            echo "Initial token fetch successful"
            break
          fi
          
          RETRY=$((RETRY + 1))
          if [ $RETRY -lt $MAX_RETRIES ]; then
            echo "Retry $RETRY/$MAX_RETRIES in 10 seconds..."
            sleep 10
          else
            echo "FATAL: Failed after $MAX_RETRIES attempts"
            exit 1
          fi
        done
        
        # Continuous refresh loop (every 6 hours)
        echo "Starting continuous refresh loop (every 6 hours)..."
        while true; do
          sleep 21600  # 6 hours (ECR tokens valid for 12 hours)
          refresh_token || echo "Token refresh failed, will retry in 6 hours"
        done
    env:
      - name: AWS_REGION
        value: us-east-1
      - name: AWS_DEFAULT_REGION
        value: us-east-1
    resources:
      requests:
        cpu: "10m"
        memory: "64Mi"
      limits:
        cpu: "50m"
        memory: "128Mi"
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true