# ArgoCD Image Updater Helm Values
# Managed by ArgoCD

# Service Account Configuration
serviceAccount:
  create: true
  name: argocd-image-updater
  annotations: {}
    # eks.amazonaws.com/role-arn: "arn:aws:iam::608713827966:role/bigrs-cluster-argo-image-updater-role"

# ArgoCD Connection Configuration
config:
  argocd:
    grpcWeb: true
    serverAddress: "http://argocd-server.argocd.svc.cluster.local"
    insecure: true
    plaintext: true
  
  # ECR Registry Configuration
  registries:
    - name: ecr
      api_url: https://608713827966.dkr.ecr.us-east-1.amazonaws.com
      prefix: 608713827966.dkr.ecr.us-east-1.amazonaws.com
      credentials: pullsecret:argocd/ecr-credentials
      default: true

# Logging Configuration
logLevel: debug

# Update Interval
interval: 2m

# Metrics Configuration
metrics:
  enabled: true
  serviceMonitor:
    enabled: false

# Resource Limits
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

# Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Image Configuration
image:
  repository: quay.io/argoprojlabs/argocd-image-updater
  pullPolicy: IfNotPresent
  tag: ""  # Uses chart appVersion by default

# Extra Arguments
extraArgs: []
#  - --disable-kubernetes
#  - --interval=5m

# Extra Environment Variables
extraEnv: 
 - name: AWS_REGION
   value: us-east-1
