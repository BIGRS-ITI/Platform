serviceAccount:
  create: true
  name: argocd-image-updater
  annotations: {}

config:
  argocd:
    grpcWeb: true
    serverAddress: "http://argocd-server.argocd.svc.cluster.local"
    insecure: true
    plaintext: true
  
  registries:
    - name: ecr
      api_url: https://608713827966.dkr.ecr.us-east-1.amazonaws.com
      prefix: 608713827966.dkr.ecr.us-east-1.amazonaws.com
      credentials: pullsecret:argocd/ecr-credentials 
      default: true

logLevel: info
interval: 2m

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

image:
  repository: quay.io/argoprojlabs/argocd-image-updater
  pullPolicy: IfNotPresent
  tag: "v0.14.0"

extraEnv:
  - name: AWS_REGION
    value: us-east-1

# Sidecar container to refresh ECR token
extraContainers:
  - name: ecr-token-refresher
    image: amazon/aws-cli:2.13.25
    command:
      - sh
      - -c
      - |
        while true; do
          echo "Refreshing ECR token..."
          
          # Get ECR token
          TOKEN=$(aws ecr get-authorization-token \
            --region us-east-1 \
            --output text \
            --query 'authorizationData[0].authorizationToken')
          
          # Create Docker config secret
          kubectl create secret docker-registry ecr-credentials \
            --docker-server=608713827966.dkr.ecr.us-east-1.amazonaws.com \
            --docker-username=AWS \
            --docker-password=$(echo $TOKEN | base64 -d | cut -d: -f2) \
            --namespace=argocd \
            --dry-run=client -o yaml | kubectl apply -f -
          
          echo "ECR token refreshed at $(date)"
          
          # Sleep for 6 hours (tokens valid for 12 hours)
          sleep 21600
        done
    env:
      - name: AWS_REGION
        value: us-east-1
    resources:
      requests:
        cpu: "10m"
        memory: "32Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"
