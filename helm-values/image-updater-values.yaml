serviceAccount:
  create: true
  name: argocd-image-updater
  annotations: {}

config:
  argocd:
    grpcWeb: true
    serverAddress: "http://argocd-server.argocd.svc.cluster.local"
    insecure: true
    plaintext: true
  
  registries:
    - name: ecr
      api_url: https://608713827966.dkr.ecr.us-east-1.amazonaws.com
      prefix: 608713827966.dkr.ecr.us-east-1.amazonaws.com
      default: true

logLevel: info
interval: 2m

extraEnv:
  - name: AWS_REGION
    value: us-east-1
  - name: AWS_DEFAULT_REGION
    value: us-east-1

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

image:
  repository: quay.io/argoprojlabs/argocd-image-updater
  pullPolicy: IfNotPresent
  tag: "v0.14.0"
