controller:
  # Jenkins image configuration
  image:
    repository: jenkins/jenkins
    tag: 2.462.3-jdk17
  
  # Service configuration
  serviceType: ClusterIP
  servicePort: 8080
  
  # Resource allocation
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  
  # Java options
  javaOpts: "-Xms512m -Xmx2048m"
  
  # Health probes - CRITICAL FIX
  healthProbes: true
  healthProbesLivenessTimeout: 5
  healthProbesReadinessTimeout: 5
  healthProbeLivenessFailureThreshold: 5
  healthProbesReadinessFailureThreshold: 3
  healthProbesStartupTimeout: 10
  healthProbesStartupFailureThreshold: 30  # Increased for slow startup
  healthProbesStartupPeriodSeconds: 10
  
  # Plugin installation 
  installPlugins:
    # Core dependencies - install these first with correct versions
    - workflow-support:896.v175a_a_9c5b_78f
    - ionicons-api:70.v2959a_b_74e3cf
    - structs:338.v848422169819
    - workflow-api:1316.v33eb_726d5b_b_
    - workflow-step-api:657.v03b_e8115821b_
    
    # Pipeline plugins
    - workflow-cps:3903.v48a_8836749e9
    - workflow-job:1436.vfa_244484591f
    - workflow-multibranch:746.v05814d19c001
    - workflow-aggregator:600.vb_57cdd26fdd7
    - pipeline-model-definition:2.2131.vb_9788088fdb_5
    - pipeline-model-extensions:2.2175.v76a_fff0a_2618
    - pipeline-groovy-lib:656.va_a_ceeb_6ffb_f7
    - pipeline-stage-view:2.34
    
    # Kubernetes integration
    - kubernetes:4253.v7700d91739e5
    - kubernetes-credentials-provider:1.262.v2670ef7ea_0c5
    
    # Configuration as Code
    - configuration-as-code:1850.va_a_8c31d3158b_
    
    # SCM
    - git:5.5.2
    - github:1.40.0
    - github-branch-source:1797.v86fdb_4d57d43
    
    # Credentials
    - credentials:1371.vfee6b_095f0a_3
    - credentials-binding:681.vf91669a_32e45
    
    # UI and extras
    - blueocean:1.27.14
    - job-dsl:1.87
    - matrix-auth:3.2.2
  
  # Jenkins Configuration as Code
  JCasC:
    defaultConfig: true
    configScripts:
      # Security configuration
      security: |
        jenkins:
          securityRealm:
            local:
              allowsSignup: false
              users:
                - id: "admin"
                  password: "${JENKINS_ADMIN_PASSWORD:-admin}"
          authorizationStrategy:
            loggedInUsersCanDoAnything:
              allowAnonymousRead: false
      
      # Kubernetes cloud configuration 
      kubernetes-config: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins:8080"
                jenkinsTunnel: "jenkins-agent:50000"
                connectTimeout: 5
                readTimeout: 15
                containerCapStr: "10"
                maxRequestsPerHostStr: "32"
                retentionTimeout: 5
                templates:
                  - name: "jenkins-agent"
                    namespace: "jenkins"
                    label: "jenkins-agent"
                    nodeUsageMode: NORMAL
                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:latest"
                        command: ""
                        args: ""
                        workingDir: "/home/jenkins/agent"
                        ttyEnabled: true
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "1000m"
                        resourceLimitMemory: "1Gi"
                    volumes:
                      # CRITICAL FIX: Single-entry map format
                      - emptyDirVolume:
                          memory: false
                          mountPath: "/tmp"
                    serviceAccount: "jenkins"
                    idleMinutes: 5
  
  # Admin credentials
  admin:
    createSecret: true
    username: "admin"
  
  # Persistence
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: "gp3"
    size: "20Gi"
    accessMode: "ReadWriteOnce"

# Service Account - EKS Pod Identity
serviceAccount:
  create: true
  name: jenkins
  annotations: {}  

# RBAC
rbac:
  create: true
  readSecrets: true

# Network Policy (optional)
networkPolicy:
  enabled: false