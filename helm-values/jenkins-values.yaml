controller:
  # Admin credentials (auto-generated)
  admin:
    createSecret: true
    username: "admin"
    # password: ""  

  serviceAccount:
    create: true
    name: jenkins

  image: "jenkins/jenkins"
  tag: "2.462.3-jdk17"

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

  javaOpts: "-Xms512m -Xmx2048m"

  installPlugins:
  - kubernetes
  - workflow-aggregator
  - git
  - configuration-as-code
  - pipeline-utility-steps
  - credentials-binding
  - kubernetes-credentials-provider

  numExecutors: 2

  JCasC:
    defaultConfig: true
    configScripts:
      welcome-message: |
        jenkins:
          systemMessage: "Jenkins for BIGRS GitOps Pipeline - Automated CI using Kaniko"

      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins:8080"
                containerCapStr: "10"
                templates:
                  - name: "kaniko-agent"
                    namespace: "jenkins"
                    label: "kaniko"
                    nodeUsageMode: NORMAL
                    idleMinutes: 3
                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:latest"
                        workingDir: "/home/jenkins/agent"
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"

                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:latest"
                        ttyEnabled: true
                        command: ""
                        args: ""
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "512Mi"
                        resourceLimitCpu: "2000m"
                        resourceLimitMemory: "2Gi"
                        volumeMounts:
                          - name: kaniko-secret
                            mountPath: /kaniko/.docker

                    volumes:
                      - name: kaniko-secret
                        secret:
                          secretName: regcred

persistence:
  enabled: true
  storageClass: "gp2"
  accessMode: "ReadWriteOnce"
  size: "8Gi"

networkPolicy:
  enabled: false

rbac:
  create: true
