# helm-values/jenkins-values.yaml
# Fixed Jenkins Helm Chart Values

controller:
  # Admin credentials
  admin:
    createSecret: true
    username: "admin"
    # password will be auto-generated

  serviceAccount:
    create: true
    name: jenkins

  image:
    registry: "docker.io"
    repository: "jenkins/jenkins"
    tag: "2.462.3-jdk17"
    pullPolicy: "IfNotPresent"

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

  javaOpts: "-Xms512m -Xmx2048m"

  # Plugins to install
  installLatestPlugins: false
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - credentials:1389.vd7a_b_f5fa_50a_2
    - git
    - configuration-as-code
    - pipeline-utility-steps
    - kubernetes-credentials-provider


  # Number of executors on master (0 = agents only)
  numExecutors: 0

  # Jenkins Configuration as Code
  JCasC:
    defaultConfig: true
    configScripts:
      welcome-message: |
        jenkins:
          systemMessage: "Jenkins for BIGRS GitOps Pipeline - Automated CI using Kaniko"

      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins:8080"
                containerCapStr: "10"
                maxRequestsPerHostStr: "32"
                templates:
                  - name: "kaniko-agent"
                    namespace: "jenkins"
                    label: "kaniko"
                    nodeUsageMode: NORMAL
                    idleMinutes: 3
                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:latest"
                        workingDir: "/home/jenkins/agent"
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"
                        alwaysPullImage: false

                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:latest"
                        ttyEnabled: true
                        alwaysPullImage: false
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "512Mi"
                        resourceLimitCpu: "2000m"
                        resourceLimitMemory: "2Gi"
                        volumeMounts:
                          - name: kaniko-secret
                            mountPath: /kaniko/.docker

                    volumes:
                      - name: kaniko-secret
                        secret:
                          secretName: regcred

  # Persistence for Jenkins home
  persistence:
    enabled: true
    size: "8Gi"
    storageClassName: "gp2"
    accessMode: "ReadWriteOnce"
    annotations: {}
    labels: {}
    # If you want to use an existing PVC:
    # existingClaim: "jenkins-home"

  # Security context
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000

  # Health checks
  livenessProbe:
    httpGet:
      path: "/login"
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: "/login"
      port: http
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# Agent configuration
agent:
  # Agent image
  image:
    repository: "jenkins/inbound-agent"
    tag: "latest"

# RBAC
rbac:
  create: true

# Service configuration
service:
  type: "ClusterIP"
  port: 8080
  targetPort: 8080
  agentListenerPort: 50000

# Network policy
networkPolicy:
  enabled: false

# Ingress (optional - for external access)
ingress:
  enabled: false
  # hostname: jenkins.bigrs.local
  # tls:
  #   - secretName: jenkins-tls
  #     hosts:
  #       - jenkins.bigrs.local