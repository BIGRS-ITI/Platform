# Jenkins Helm Chart Values
# Deployed via ArgoCD from Platform repository

controller:
  # Admin credentials
  adminUser: "admin"
  # Password will be auto-generated and stored in a secret
  
  # Service Account Configuration
  serviceAccount:
    create: true
    name: jenkins
    annotations: {}
  
  # Resources
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  
  # Java VM options
  javaOpts: "-Xms512m -Xmx2048m"
  
  # Jenkins plugins to install
  installPlugins:
    - kubernetes:4253.v7700d91739e5
    - workflow-aggregator:600.vb_57cdd26fdd7
    - git:5.5.2
    - configuration-as-code:1909.vb_b_f7d0c4a_b_c9
    - docker-workflow:580.vc0c340686b_54
    - pipeline-utility-steps:2.16.2
    - credentials-binding:677.vdc9d38cb_254d
    - kubernetes-credentials-provider:1.262.v2670ef7ea_0c5
  
  # Number of executors (parallel jobs)
  numExecutors: 2
  
  # Jenkins Configuration as Code (JCasC)
  JCasC:
    defaultConfig: true
    configScripts:
      welcome-message: |
        jenkins:
          systemMessage: "Jenkins for BIGRS GitOps Pipeline - Automated CI"
      
      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins:8080"
                jenkinsTunnel: "jenkins-agent:50000"
                containerCapStr: "10"
                connectTimeout: 5
                readTimeout: 15
                podLabels:
                  - key: "jenkins/agent"
                    value: "true"
                templates:
                  # Docker Build Agent - For building and pushing Docker images
                  - name: "docker-build-agent"
                    namespace: "jenkins"
                    serviceAccount: "jenkins"
                    label: "docker-build"
                    nodeUsageMode: NORMAL
                    idleMinutes: 5
                    podRetention: "never"
                    containers:
                      # JNLP container (connects agent to Jenkins controller)
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:latest"
                        workingDir: "/home/jenkins/agent"
                        ttyEnabled: false
                        resourceRequestCpu: "100m"
                        resourceRequestMemory: "128Mi"
                        resourceLimitCpu: "200m"
                        resourceLimitMemory: "256Mi"
                      # Docker container (Docker-in-Docker for building images)
                      - name: "docker"
                        image: "docker:24-dind"
                        workingDir: "/home/jenkins/agent"
                        ttyEnabled: true
                        privileged: true
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "1Gi"
                        resourceLimitCpu: "2000m"
                        resourceLimitMemory: "2Gi"
                        envVars:
                          - envVar:
                              key: "DOCKER_TLS_CERTDIR"
                              value: ""
                      # AWS CLI container (for ECR operations)
                      - name: "aws-cli"
                        image: "amazon/aws-cli:latest"
                        workingDir: "/home/jenkins/agent"
                        ttyEnabled: true
                        command: "cat"
                        resourceRequestCpu: "100m"
                        resourceRequestMemory: "128Mi"
                        resourceLimitCpu: "200m"
                        resourceLimitMemory: "256Mi"
                    volumes:
                      # Shared docker socket volume
                      - emptyDirVolume:
                          mountPath: "/var/run"
                          memory: false
                    yamlMergeStrategy: "override"
                  
                  # Default Agent - For simple tasks without Docker
                  - name: "default-agent"
                    namespace: "jenkins"
                    serviceAccount: "jenkins"
                    label: "jenkins-agent"
                    nodeUsageMode: NORMAL
                    idleMinutes: 5
                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:latest"
                        workingDir: "/home/jenkins/agent"
                        ttyEnabled: true
                        resourceRequestCpu: "250m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"

# Agent Configuration
agent:
  enabled: true
  defaultsProviderTemplate: "jenkins-agent"
  
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  
  workingDir: "/home/jenkins/agent"

# Persistence
persistence:
  enabled: true
  existingClaim: false
  storageClass: "gp2"
  accessMode: "ReadWriteOnce"
  size: "8Gi"

# Network Policy
networkPolicy:
  enabled: false

# RBAC
rbac:
  create: true
  readSecrets: true
