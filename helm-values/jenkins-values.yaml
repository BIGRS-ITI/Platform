controller:
  # Jenkins image configuration
  image:
    repository: jenkins/jenkins
    tag: 2.528.1-lts-jdk21  # Updated to latest LTS with JDK 21 for security fixes and longer support
  
  # Service configuration
  serviceType: ClusterIP
  servicePort: 8080
  
  # Resource allocation
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  
  # Java options
  javaOpts: "-Xms512m -Xmx2048m"
  
  # Health probes - CRITICAL FIX
  healthProbes: true
  healthProbesLivenessTimeout: 5
  healthProbesReadinessTimeout: 5
  healthProbeLivenessFailureThreshold: 5
  healthProbesReadinessFailureThreshold: 3
  healthProbesStartupTimeout: 10
  healthProbesStartupFailureThreshold: 30  # Increased for slow startup
  healthProbesStartupPeriodSeconds: 10
  

  # Plugins to install
  installLatestPlugins: true
  installPlugins:
    - kubernetes:4308.va_4691894c567  # Latest stable version
    - workflow-aggregator:600.vb_57cdd26fdd7  # Latest pipeline plugin
    - git:5.7.0  # Updated git plugin with security fixes
    - configuration-as-code:1909.vb_b_f59d59d104  # Latest JCasC
    - pipeline-utility-steps:2.17.0
    - kubernetes-credentials-provider:1.270.v0445f6a_a_a_234
    - credentials-binding:690.v8e82a_6ea_5dfa_  # Updated to fix masking vulnerability
    - git-client:6.0.0  # Updated to address file system disclosure

  # Startup Probe
  startupProbe:
    httpGet:
      path: /
      port: http
    failureThreshold: 60
    periodSeconds: 10
    timeoutSeconds: 5

  # Liveness Probe
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 60
    failureThreshold: 5
    periodSeconds: 10

  # Readiness Probe
  readinessProbe:
    httpGet:
      path: /login
      port: http
    initialDelaySeconds: 60
    failureThreshold: 3
    periodSeconds: 10

  # Jenkins Configuration as Code
  JCasC:
    defaultConfig: true
    configScripts:
      # Security configuration
      security: |
        jenkins:
          securityRealm:
            local:
              allowsSignup: false
              users:
                - id: "admin"
                  password: "${JENKINS_ADMIN_PASSWORD:-admin}"
          authorizationStrategy:
            loggedInUsersCanDoAnything:
              allowAnonymousRead: false
      
      # Kubernetes cloud configuration 
      kubernetes-config: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins:8080"
                jenkinsTunnel: "jenkins-agent:50000"
                connectTimeout: 5
                readTimeout: 15
                containerCapStr: "10"
                maxRequestsPerHostStr: "32"
                retentionTimeout: 5
                templates:
                  - name: "docker-build"
                    namespace: "jenkins"
                    label: "jenkins-agent"
                    nodeUsageMode: NORMAL
                    serviceAccount: "jenkins"
                    idleMinutes: 5
                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:latest"
                        ttyEnabled: true
                        workingDir: "/home/jenkins/agent"
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "1000m"
                        resourceLimitMemory: "1Gi"

                      - name: "docker"
                        image: "docker:25.0.0-dind"
                        privileged: true
                        ttyEnabled: true
                        command: "dockerd-entrypoint.sh"
                        args: "--host=tcp://0.0.0.0:2375"

                      - name: "aws-cli"
                        image: "amazon/aws-cli:2.17.0"
                        ttyEnabled: true
                        command: "cat"
                        args: ""
                    volumes:
                      - emptyDirVolume:
                          memory: false
                          mountPath: "/var/lib/docker"
                      - emptyDirVolume:
                          memory: false
                          mountPath: "/tmp"

  
  # Admin credentials
  admin:
    createSecret: true
    username: "admin"

# Persistence - Must be at root level, not under controller
persistence:
  enabled: true
  existingClaim: ""
  # storageClass: "gp3"
  storageClass: "gp2"
  size: "20Gi"
  accessMode: "ReadWriteOnce"

# Service Account - EKS Pod Identity
serviceAccount:
  create: true
  name: jenkins
  annotations: {}  

# RBAC
rbac:
  create: true
  readSecrets: true

# Network Policy (optional)
networkPolicy:
  enabled: false
