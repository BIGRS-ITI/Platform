controller:
  # Admin credentials (auto-generated)
  admin:
    createSecret: true
    username: "admin"
    # password: ""  

  serviceAccount:
    create: true
    name: jenkins

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

  javaOpts: "-Xms512m -Xmx2048m"

  installPlugins:
    - kubernetes:4253.v7700d91739e5
    - workflow-aggregator:600.vb_57cdd26fdd7
    - git:5.5.2
    - configuration-as-code:1909.vb_b_f7d0c4a_b_c9
    - pipeline-utility-steps:2.16.2
    - credentials-binding:677.vdc9d38cb_254d
    - kubernetes-credentials-provider:1.262.v2670ef7ea_0c5
    - google-oauth-plugin:1.0.14
    - aws-java-sdk:1.12.730-430.vf34161f2f5a6
    - docker-commons:439.vf46b_7fa_3b_54a

  numExecutors: 2

  JCasC:
    defaultConfig: true
    configScripts:
      welcome-message: |
        jenkins:
          systemMessage: "Jenkins for BIGRS GitOps Pipeline - Automated CI using Kaniko"

      kubernetes-cloud: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins:8080"
                containerCapStr: "10"
                templates:
                  - name: "kaniko-agent"
                    namespace: "jenkins"
                    label: "kaniko"
                    nodeUsageMode: NORMAL
                    idleMinutes: 3
                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:latest"
                        workingDir: "/home/jenkins/agent"
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "500m"
                        resourceLimitMemory: "512Mi"

                      - name: "kaniko"
                        image: "gcr.io/kaniko-project/executor:latest"
                        ttyEnabled: true
                        command: ""
                        args: ""
                        resourceRequestCpu: "500m"
                        resourceRequestMemory: "512Mi"
                        resourceLimitCpu: "2000m"
                        resourceLimitMemory: "2Gi"
                        volumeMounts:
                          - name: kaniko-secret
                            mountPath: /kaniko/.docker

                    volumes:
                      - name: kaniko-secret
                        secret:
                          secretName: regcred

persistence:
  enabled: true
  storageClass: "gp2"
  accessMode: "ReadWriteOnce"
  size: "8Gi"

networkPolicy:
  enabled: false

rbac:
  create: true
