controller:
  # Jenkins image configuration
  image:
    repository: jenkins/jenkins
    tag: 2.462.3-jdk17
  
  # Service configuration
  serviceType: ClusterIP
  servicePort: 8080
  
  # Resource allocation
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2
      memory: 2Gi
  
  # Java options
  javaOpts: "-Xms512m -Xmx2048m"
  
  # Health probes - CRITICAL FIX
  healthProbes: true
  healthProbesLivenessTimeout: 5
  healthProbesReadinessTimeout: 5
  healthProbeLivenessFailureThreshold: 5
  healthProbesReadinessFailureThreshold: 3
  healthProbesStartupTimeout: 10
  healthProbesStartupFailureThreshold: 30  # Increased for slow startup
  healthProbesStartupPeriodSeconds: 10
  

  # Plugins to install
  installLatestPlugins: true
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - configuration-as-code
    - pipeline-utility-steps
    - kubernetes-credentials-provider
  
  # Jenkins Configuration as Code
  JCasC:
    defaultConfig: true
    configScripts:
      # Security configuration
      security: |
        jenkins:
          securityRealm:
            local:
              allowsSignup: false
              users:
                - id: "admin"
                  password: "${JENKINS_ADMIN_PASSWORD:-admin}"
          authorizationStrategy:
            loggedInUsersCanDoAnything:
              allowAnonymousRead: false
      
      # Kubernetes cloud configuration 
      kubernetes-config: |
        jenkins:
          clouds:
            - kubernetes:
                name: "kubernetes"
                serverUrl: "https://kubernetes.default"
                namespace: "jenkins"
                jenkinsUrl: "http://jenkins:8080"
                jenkinsTunnel: "jenkins-agent:50000"
                connectTimeout: 5
                readTimeout: 15
                containerCapStr: "10"
                maxRequestsPerHostStr: "32"
                retentionTimeout: 5
                templates:
                  - name: "jenkins-agent"
                    namespace: "jenkins"
                    label: "jenkins-agent"
                    nodeUsageMode: NORMAL
                    containers:
                      - name: "jnlp"
                        image: "jenkins/inbound-agent:latest"
                        command: ""
                        args: ""
                        workingDir: "/home/jenkins/agent"
                        ttyEnabled: true
                        resourceRequestCpu: "200m"
                        resourceRequestMemory: "256Mi"
                        resourceLimitCpu: "1000m"
                        resourceLimitMemory: "1Gi"
                    volumes:
                      # CRITICAL FIX: Single-entry map format
                      - emptyDirVolume:
                          memory: false
                          mountPath: "/tmp"
                    serviceAccount: "jenkins"
                    idleMinutes: 5
  
  # Admin credentials
  admin:
    createSecret: true
    username: "admin"
  
  # Persistence
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: "gp3"
    size: "20Gi"
    accessMode: "ReadWriteOnce"

# Service Account - EKS Pod Identity
serviceAccount:
  create: true
  name: jenkins
  annotations: {}  

# RBAC
rbac:
  create: true
  readSecrets: true

# Network Policy (optional)
networkPolicy:
  enabled: false
