# ================================
# External Secrets Operator Values
# ================================

# Install CRDs automatically (required for first-time setup)
installCRDs: true

# Service Account Configuration
serviceAccount:
  create: true
  name: external-secrets
  namespace: external-secrets
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::636078031259:role/bigrs-cluster-external-secrets-role 

# Resource Requests (lightweight operator)
resources:
  requests:
    cpu: 100m
    memory: 128Mi

# Disable Prometheus metrics unless monitoring stack is installed
metrics:
  serviceMonitor:
    enabled: false

# Set log verbosity
logLevel: info
