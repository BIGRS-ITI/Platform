# ================================
# External Secrets Operator Values
# ================================

# Install CRDs automatically (required for first-time setup)
installCRDs: false

# Service Account Configuration
serviceAccount:
  create: true
  name: external-secrets
   
# Resource Requests (lightweight operator)
resources:
  requests:
    cpu: 100m
    memory: 128Mi

# Disable Prometheus metrics unless monitoring stack is installed
metrics:
  serviceMonitor:
    enabled: false

# Set log verbosity
logLevel: info
