# ================================
# External Secrets Operator Values
# ================================

# Install CRDs automatically (required for first-time setup)
installCRDs: false

# Service Account Configuration
serviceAccount:
  create: true
  name: external-secrets
  automountServiceAccountToken: false

# Explicitly set environment variables for Pod Identity
extraEnv:
  - name: AWS_STS_REGIONAL_ENDPOINTS
    value: regional
  - name: AWS_DEFAULT_REGION
    value: us-east-1
  - name: AWS_REGION
    value: us-east-1
# Resource Requests (lightweight operator)
resources:
  requests:
    cpu: 100m
    memory: 128Mi

# Disable Prometheus metrics unless monitoring stack is installed
metrics:
  serviceMonitor:
    enabled: false

# Set log verbosity
logLevel: info
