# Place this file at: helm-values/nginx-values.yaml in your Git repo

controller:
  replicaCount: 2
  
  service:
    type: LoadBalancer
    annotations:
      # Updated to modern AWS Load Balancer Controller format
      service.beta.kubernetes.io/aws-load-balancer-type: "external"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true  # For Prometheus Operator
  
  admissionWebhooks:
    enabled: true
    failurePolicy: Fail
  
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:  # Added resource limits
      cpu: 500m
      memory: 512Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80  # Added metric
    targetMemoryUtilizationPercentage: 80  # Added metric
  
  # High availability: spread across availability zones
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - ingress-nginx
            topologyKey: topology.kubernetes.io/zone
  
  # Ingress class configuration
  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  
  # Additional config options
  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    ssl-protocols: "TLSv1.2 TLSv1.3"
    proxy-body-size: "10m"