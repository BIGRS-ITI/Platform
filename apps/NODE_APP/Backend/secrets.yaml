apiVersion: v1
kind: Secret
metadata:
  name: taskmanager-secrets
  namespace: taskmanager
type: Opaque
stringData:
  # RDS MySQL Credentials (from Terraform outputs)
  # Update these after running: terraform output rds_endpoint
  mysql-password: "password123"  # Same as in RDS module main.tf
  
  # Redis Password (optional, leave empty if no auth)
  redis-password: ""
  
  # Database Connection Details (will be injected via ConfigMap for host)
  # Full connection string for reference
  # Format: mysql://admin:password123@<RDS_ENDPOINT>/mydb
