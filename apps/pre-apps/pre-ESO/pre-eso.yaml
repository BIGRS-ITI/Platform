# ===========================================
# Namespace for External Secrets Operator
# ===========================================
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: external-secrets-operator
---
# ===========================================
# External Secrets CRDs (from official repo)
# ===========================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://raw.githubusercontent.com/external-secrets/external-secrets/main/deploy/crds/bundle.yaml

