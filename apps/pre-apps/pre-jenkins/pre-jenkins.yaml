apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: jenkins-priority
value: 1000000  
globalDefault: false
preemptionPolicy: PreemptLowerPriority 
description: "Priority for Jenkins master"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-sc
provisioner: ebs.csi.aws.com
parameters:
  type: gp2
  fsType: ext4
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-pv
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ebs-sc
  csi:
    driver: ebs.csi.aws.com
    # volume created at us-east-1c
    volumeHandle: vol-0cf8e04a24a63bb4b
    fsType: ext4

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-data
  namespace: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 20Gi
  volumeName: jenkins-pv
