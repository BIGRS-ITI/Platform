apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-token-refresher
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecr-token-refresher
    app.kubernetes.io/part-of: argocd-image-updater

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-token-refresher
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecr-token-refresher
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr-credentials"]
    verbs: ["get", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-token-refresher
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecr-token-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-token-refresher
subjects:
  - kind: ServiceAccount
    name: ecr-token-refresher
    namespace: argocd

---
# Initial Job - Runs immediately on deployment
apiVersion: batch/v1
kind: Job
metadata:
  name: ecr-token-refresher-init
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecr-token-refresher
    app.kubernetes.io/component: init
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecr-token-refresher
        app.kubernetes.io/component: init
    spec:
      serviceAccountName: ecr-token-refresher
      restartPolicy: OnFailure
      
      containers:
        - name: refresh-token
          image: alpine:3.19
          command:
            - sh
            - -c
            - |
              set -e
              
              echo "=== Initial ECR Token Refresh ==="
              echo "Timestamp: $(date)"
              
              # Install dependencies
              echo "Installing dependencies..."
              apk add --no-cache \
                python3 \
                py3-pip \
                curl \
                unzip \
                kubectl \
                bash
              
              # Install AWS CLI v2
              echo "Installing AWS CLI v2..."
              # Create and activate a venv
              python3 -m venv /opt/awscli-venv
              . /opt/awscli-venv/bin/activate

              # Install AWS CLI v1 inside the venv
              pip install awscli --upgrade --no-cache-dir
              
              # Verify AWS CLI
              aws --version
              
              # Wait for Pod Identity to be ready
              echo "Waiting 15 seconds for Pod Identity..."
              sleep 15
              
              # Test AWS credentials
              echo "Testing AWS credentials via Pod Identity..."
              aws sts get-caller-identity
              
              if [ $? -ne 0 ]; then
                echo "❌ FATAL: Cannot get AWS credentials via Pod Identity"
                exit 1
              fi
              
              echo "✅ Pod Identity working correctly"
              
              # Get ECR authorization token
              echo "Fetching ECR authorization token..."
              TOKEN=$(aws ecr get-authorization-token \
                --region us-east-1 \
                --output text \
                --query 'authorizationData[0].authorizationToken')
              
              if [ -z "$TOKEN" ]; then
                echo "❌ FATAL: Failed to get ECR token"
                exit 1
              fi
              
              echo "✅ ECR token retrieved (${#TOKEN} characters)"
              
              # Decode token to extract password
              PASSWORD=$(echo "$TOKEN" | base64 -d | cut -d: -f2)
              
              if [ -z "$PASSWORD" ]; then
                echo "❌ FATAL: Failed to decode token"
                exit 1
              fi
              
              echo "✅ Token decoded (password: ${#PASSWORD} characters)"
              
              # Delete existing secret if exists
              echo "Removing old secret if exists..."
              kubectl delete secret ecr-credentials -n argocd --ignore-not-found=true
              
              # Create Kubernetes secret
              echo "Creating ECR credentials secret..."
              # --docker-server=608713827966.dkr.ecr.us-east-1.amazonaws.com
              kubectl create secret docker-registry ecr-credentials \
                --docker-server=608713827966.dkr.ecr.us-east-1.amazonaws.com \
                --docker-username=AWS \
                --docker-password="$PASSWORD" \
                --namespace=argocd
              
              if [ $? -eq 0 ]; then
                echo ""
                echo "✅ ============================================"
                echo "✅ SUCCESS: ECR credentials secret created!"
                echo "✅ ============================================"
                echo "Secret name: ecr-credentials"
                echo "Namespace: argocd"
                echo "Created at: $(date)"
                echo ""
                
                # Verify secret
                kubectl get secret ecr-credentials -n argocd -o jsonpath='{.metadata.creationTimestamp}'
                echo ""
                exit 0
              else
                echo "❌ FATAL: Failed to create secret"
                exit 1
              fi
          
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_EC2_METADATA_DISABLED
              value: "false"
          
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          
          securityContext:
            runAsNonRoot: false  # Need root to install packages
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false

---
# CronJob - Refreshes token every 6 hours
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresher
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecr-token-refresher
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 3
      
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ecr-token-refresher
            app.kubernetes.io/component: cronjob
        spec:
          serviceAccountName: ecr-token-refresher
          restartPolicy: OnFailure
          
          containers:
            - name: refresh-token
              image: alpine:3.19
              command:
                - sh
                - -c
                - |
                  set -e
                  
                  echo "=== Scheduled ECR Token Refresh ==="
                  echo "Timestamp: $(date)"
                  
                  # Install dependencies
                  apk add --no-cache python3 py3-pip curl unzip kubectl bash >/dev/null 2>&1
                  
                  # Install AWS CLI v2
                  cd /tmp
                  curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
                  unzip -q awscliv2.zip
                  ./aws/install >/dev/null 2>&1
                  
                  # Get ECR token
                  TOKEN=$(aws ecr get-authorization-token \
                    --region us-east-1 \
                    --output text \
                    --query 'authorizationData[0].authorizationToken')
                  
                  if [ -z "$TOKEN" ]; then
                    echo "❌ ERROR: Failed to get ECR token"
                    exit 1
                  fi
                  
                  # Decode token
                  PASSWORD=$(echo "$TOKEN" | base64 -d | cut -d: -f2)
                  
                  if [ -z "$PASSWORD" ]; then
                    echo "❌ ERROR: Failed to decode token"
                    exit 1
                  fi
                  
                  # Delete and recreate secret
                  kubectl delete secret ecr-credentials -n argocd --ignore-not-found=true
                  
                    # --docker-server=608713827966.dkr.ecr.us-east-1.amazonaws.com \
                  kubectl create secret docker-registry ecr-credentials \
                    --docker-server=608713827966.dkr.ecr.us-east-1.amazonaws.com \
                    --docker-username=AWS \
                    --docker-password="$PASSWORD" \
                    --namespace=argocd
                  
                  if [ $? -eq 0 ]; then
                    echo "✅ SUCCESS: ECR credentials refreshed at $(date)"
                  else
                    echo "❌ ERROR: Failed to refresh secret"
                    exit 1
                  fi
              
              env:
                - name: AWS_REGION
                  value: us-east-1
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: AWS_EC2_METADATA_DISABLED
                  value: "false"
              
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              
              securityContext:
                runAsNonRoot: false
                runAsUser: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: false