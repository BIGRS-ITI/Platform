apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-token-refresher
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecr-token-refresher
    app.kubernetes.io/part-of: argocd-image-updater

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-token-refresher
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecr-token-refresher
rules:
  # Allow creating secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # Allow updating the specific ECR credentials secret
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ecr-credentials"]
    verbs: ["get", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-token-refresher
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecr-token-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-token-refresher
subjects:
  - kind: ServiceAccount
    name: ecr-token-refresher
    namespace: argocd

---
# Initial Job - Runs immediately on deployment
apiVersion: batch/v1
kind: Job
metadata:
  name: ecr-token-refresher-init
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecr-token-refresher
    app.kubernetes.io/component: init
spec:
  ttlSecondsAfterFinished: 300  
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecr-token-refresher
        app.kubernetes.io/component: init
    spec:
      serviceAccountName: ecr-token-refresher
      restartPolicy: OnFailure
      
      containers:
        - name: refresh-token
          image: amazon/aws-cli:2.13.25
          command:
            - sh
            - -c
            - |
              set -e
              
              echo "=== Initial ECR Token Refresh ==="
              echo "Timestamp: $(date)"
              
              # Wait for Pod Identity to be ready
              echo "Waiting 10 seconds for Pod Identity..."
              sleep 10
              
              # Test AWS credentials
              echo "Testing AWS credentials..."
              aws sts get-caller-identity
              
              if [ $? -ne 0 ]; then
                echo "FATAL: Cannot get AWS credentials via Pod Identity"
                exit 1
              fi
              
              echo "Pod Identity working"
              
              # Get ECR authorization token
              echo "Fetching ECR authorization token..."
              TOKEN=$(aws ecr get-authorization-token \
                --region us-east-1 \
                --output text \
                --query 'authorizationData[0].authorizationToken')
              
              if [ -z "$TOKEN" ]; then
                echo "FATAL: Failed to get ECR token"
                exit 1
              fi
              
              echo "ECR token retrieved (length: ${#TOKEN} chars)"
              
              # Decode token to extract password
              PASSWORD=$(echo "$TOKEN" | base64 -d | cut -d: -f2)
              
              if [ -z "$PASSWORD" ]; then
                echo "FATAL: Failed to decode token"
                exit 1
              fi
              
              echo "Token decoded (password length: ${#PASSWORD} chars)"
              
              # Delete existing secret if exists
              kubectl delete secret ecr-credentials -n argocd --ignore-not-found=true
              
              # Create Kubernetes secret
              kubectl create secret docker-registry ecr-credentials \
                --docker-server=608713827966.dkr.ecr.us-east-1.amazonaws.com \
                --docker-username=AWS \
                --docker-password="$PASSWORD" \
                --namespace=argocd
              
              if [ $? -eq 0 ]; then
                echo "SUCCESS: ECR credentials secret created"
                echo "Secret name: ecr-credentials"
                echo "Namespace: argocd"
                echo "Timestamp: $(date)"
                
                # Verify secret was created
                kubectl get secret ecr-credentials -n argocd
                exit 0
              else
                echo "FATAL: Failed to create secret"
                exit 1
              fi
          
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

---
# CronJob - Refreshes token every 6 hours
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresher
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecr-token-refresher
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 */6 * * *"  # Every 6 hours (at :00 minutes)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid  # Don't allow concurrent jobs
  
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600  # Clean up after 1 hour
      backoffLimit: 3
      
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ecr-token-refresher
            app.kubernetes.io/component: cronjob
        spec:
          serviceAccountName: ecr-token-refresher
          restartPolicy: OnFailure
          
          containers:
            - name: refresh-token
              image: amazon/aws-cli:2.13.25
              command:
                - sh
                - -c
                - |
                  set -e
                  
                  echo "=== Scheduled ECR Token Refresh ==="
                  echo "Timestamp: $(date)"
                  
                  # Get ECR authorization token
                  echo "Fetching ECR authorization token..."
                  TOKEN=$(aws ecr get-authorization-token \
                    --region us-east-1 \
                    --output text \
                    --query 'authorizationData[0].authorizationToken')
                  
                  if [ -z "$TOKEN" ]; then
                    echo "ERROR: Failed to get ECR token"
                    exit 1
                  fi
                  
                  # Decode token
                  PASSWORD=$(echo "$TOKEN" | base64 -d | cut -d: -f2)
                  
                  if [ -z "$PASSWORD" ]; then
                    echo "ERROR: Failed to decode token"
                    exit 1
                  fi
                  
                  # Delete and recreate secret
                  kubectl delete secret ecr-credentials -n argocd --ignore-not-found=true
                  
                  kubectl create secret docker-registry ecr-credentials \
                    --docker-server=608713827966.dkr.ecr.us-east-1.amazonaws.com \
                    --docker-username=AWS \
                    --docker-password="$PASSWORD" \
                    --namespace=argocd
                  
                  if [ $? -eq 0 ]; then
                    echo "SUCCESS: ECR credentials refreshed at $(date)"
                    kubectl get secret ecr-credentials -n argocd -o jsonpath='{.metadata.creationTimestamp}'
                    echo ""
                  else
                    echo "ERROR: Failed to refresh secret"
                    exit 1
                  fi
              
              env:
                - name: AWS_REGION
                  value: us-east-1
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
              
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "100m"
                  memory: "256Mi"
              
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
