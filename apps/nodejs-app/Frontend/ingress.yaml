apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: taskmanager
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Cert-manager annotation to automatically issue certificates
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Nginx ingress annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # Enable gzip compression for frontend assets
    nginx.ingress.kubernetes.io/enable-gzip: "true"
  labels:
    app: frontend
    tier: web
spec:
  ingressClassName: nginx
  
  tls:
    - hosts:
        - happyhosting.me
        - www.happyhosting.me
      secretName: happyhosting-me-tls
  
  rules:
    # Main domain
    - host: happyhosting.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    
    # www subdomain redirect to main domain
    - host: www.happyhosting.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
