apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-token
  namespace: jenkins
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: jenkins-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/JENKINS_TOKEN
    