apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-app
  namespace: argocd
  annotations:
    # Image updater annotations
    argocd-image-updater.argoproj.io/image-list: nodejs=608713827966.dkr.ecr.us-east-1.amazonaws.com/nodejs-app
    argocd-image-updater.argoproj.io/nodejs.update-strategy: latest
    argocd-image-updater.argoproj.io/nodejs.allow-tags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
    # Optional: write back method (git or argocd)
    argocd-image-updater.argoproj.io/write-back-method: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/BIGRS-ITI/Platform.git
    targetRevision: main
    path: apps/NodeJs
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

