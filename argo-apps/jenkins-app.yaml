apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/health-check: "jenkins.io/v1alpha2/Jenkins"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  # Multiple sources: Helm chart + values from Git
  sources:
    # Source 1: Helm Chart from Jenkins repo
    - repoURL: https://charts.jenkins.io
      chart: jenkins
      targetRevision: 5.8.108
      helm:
        releaseName: jenkins
        valueFiles:
          - $values/helm-values/jenkins-values.yaml
    
    # Source 2: Values file from Platform Git repo
    - repoURL: https://github.com/BIGRS-ITI/Platform.git
      targetRevision: main
      ref: values
  
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
