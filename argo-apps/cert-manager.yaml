apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"  
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  # Multi-source: Helm chart repository + Git repository for values
  sources:
    # Source 1: Helm chart from Jetstack repository
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.16.1
      helm:
        releaseName: cert-manager
        # Reference the values file from the Git repository (second source)
        valueFiles:
          - $values/helm-values/cert-manager-values.yaml
    
    # Source 2: Values file from Platform Git repo
    - repoURL: https://github.com/BIGRS-ITI/Platform.git
      targetRevision: prod
      ref: values      
  
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Replace=true  # Important for CRD updates
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Ignore webhook certificate bundle changes
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle