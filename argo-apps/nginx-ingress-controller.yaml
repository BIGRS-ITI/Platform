apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.11.3
      helm:
        releaseName: ingress-nginx
        valueFiles:
          - $values/helm-values/nginx-values.yaml
        # CRITICAL: Skip schema validation
        skipCrds: false
        
    - repoURL: https://github.com/BIGRS-ITI/Platform.git
      targetRevision: main
      ref: values
  
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      # CRITICAL FIX: Disable server-side apply for Helm
      - ServerSideApply=false
      # Skip validation that causes issues
      - Validate=false
      # Apply resources even if out of sync
      - ApplyOutOfSyncOnly=false
    retry:
      limit: 15
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 10m
  
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'