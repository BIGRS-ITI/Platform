apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  # Multiple sources: Helm chart + values from Git
  sources:
    # Source 1: Helm Chart from ArgoProj repo
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argocd-image-updater
      targetRevision: 0.14.0
      helm:
        releaseName: argocd-image-updater
        valueFiles:
          - $values/helm-values/image-updater-values.yaml
    
    # Source 2: Values file from Platform Git repo
    - repoURL: https://github.com/BIGRS-ITI/Platform.git
      targetRevision: main
      ref: values
  
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m

