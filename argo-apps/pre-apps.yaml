apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pre-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/BIGRS-ITI/Platform.git
    targetRevision: main
    path: apps/pre-apps
  
  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m